{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "claudex.serviceAccountName" . }}
  labels:
    {{- include "claudex.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agents talk to the Anthropic and OpenAI APIs, not to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
