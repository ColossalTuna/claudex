name: release

# Publishing happens only on a v* tag, so pushing to a branch never changes
# what anyone pulls.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write   # required for keyless cosign signing

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Sequential so the base image's layers are in the registry cache before
      # the agent images that share them are built.
      max-parallel: 1
      matrix:
        include:
          - target: base
            name: claudex-base
          - target: claude
            name: claudex-claude
          - target: codex
            name: claudex-codex

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto is the action's default, stated here because it is
          # load-bearing: it emits `latest` only for a stable semver tag, so a
          # prerelease like v1.4.0-rc.1 cannot overwrite the stable image. A
          # `type=raw,value=latest` line would fire unconditionally and defeat
          # this. A tag that is not semver at all produces no tags and fails the
          # build below, which is the intended fail-loud behaviour.
          flavor: |
            latest=auto

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign the published digest
        # Keyless: the signature is bound to this workflow's OIDC identity, so
        # anyone can verify who built the image without a key to manage.
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}"

      - name: Record what was published
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "verify with:"
            echo
            echo '```'
            echo "cosign verify ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.push.outputs.digest }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
